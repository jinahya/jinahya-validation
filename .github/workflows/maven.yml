# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    # one run per validation provider, each building every Jakarta EE generation (jinahya-validation-NN); the
    # generation is a module, not a profile, so only the provider varies, as ./_mvn.sh does locally
    strategy:
      fail-fast: false
      matrix:
        provider: [ hibernate-validator, apache-bval ]

    name: build (${{ matrix.provider }})

    steps:
    - uses: actions/checkout@v7
    # The build JDK, not the target: each generation compiles its main classes for its own minimum Java SE
    # (--release 11, --release 17), and the test classes for 25, which only a JDK 25 javac can do; keep this in step
    # with maven.compiler.testSource and the enforcer's enforce-require-test-java-version in the root pom.
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: ./mvnw -B verify -P${{ matrix.provider }}

  # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
  # Submitted once, from the default provider, so the two builds do not overwrite each other's snapshot
  dependency-graph:

    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    # the snapshot upload is a write against the repository, which the default
    # token is not granted; scoped to this job so the build matrix keeps its
    # read-only one
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
